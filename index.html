<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Anatomia 1 - 5c</title>
  <style>
    body { font-family: -apple-system, Helvetica, sans-serif; margin: 0; padding: 8px; background: #f2f2f7; color: #111; }
    #topbar { margin-bottom: 6px; overflow: hidden; }
    .small-btn { width: 48%; background: #e5e5ea; color: #111; font-size: 13px; padding: 7px; border: none; border-radius: 6px; font-weight: bold; }
    #setup { background: #fff; padding: 8px; border-radius: 8px; margin-bottom: 8px; }
    input, textarea, button { width: 100%; box-sizing: border-box; font-size: 16px; border-radius: 8px; border: 1px solid #ccc; padding: 8px; margin-top: 5px; }
    #sendBtn { background: #007aff; color: #fff; border: none; font-weight: bold; padding: 10px; }
    #sendBtn:disabled { background: #99c9ff; }
    #chat { background: #fff; border-radius: 8px; padding: 10px; min-height: 230px; max-height: 56vh; overflow-y: auto; margin-bottom: 8px; white-space: pre-wrap; word-wrap: break-word; line-height: 1.4; font-size: 15px; }
    .user { color: #007aff; font-weight: bold; margin-top: 8px; }
    .bot { color: #111; margin-top: 4px; padding-bottom: 8px; border-bottom: 1px solid #eee; }
  </style>
</head>
<body>
  <div id="topbar">
    <button class="small-btn" style="float:left;" onclick="nuovaChat()">Nuova chat</button>
    <button class="small-btn" style="float:right;" onclick="toggleKey()">Chiave API</button>
  </div>
  <div id="setup">
    <input type="password" id="apiKey" placeholder="Chiave Groq (gsk_...) o Google (AQ.Ab8...)">
    <button style="background:#34c759;color:#fff;border:none;font-weight:bold;" onclick="salvaKey()">Salva Chiave</button>
  </div>
  <div id="chat">Pronto (Anatomia 1 - Alta Precisione). Fai una domanda.</div>
  <textarea id="prompt" rows="2" placeholder="Es. Origine e inserzione del..."></textarea>
  <button id="sendBtn" onclick="invia()">Invia</button>

  <script>
    var keyInput = document.getElementById('apiKey');
    var setupBox = document.getElementById('setup');
    var chatBox = document.getElementById('chat');
    var promptBox = document.getElementById('prompt');
    var sendBtn = document.getElementById('sendBtn');

    var modelliGroq = [
      'meta-llama/llama-4-maverick-17b-128e-instruct',
      'meta-llama/llama-4-scout-17b-16e-instruct',
      'llama-3.1-8b-instant'
    ];
    var modelliGoogle = [
      'gemini-3.8-flash',
      'gemini-3.8-flash-lite',
      'gemini-2.5-flash-lite'
    ];

    var systemPrompt = 'Sei un professore universitario di Anatomia Umana (Anatomia 1) e Medicina. Rispondi in italiano con assoluta precisione accademica secondo la Terminologia Anatomica ufficiale e il programma di Anatomia 1 (generalita, piani, organi cavi e pieni, sierose; locomotore: ossa, sinartrosi e diartrosi, rachide C1-C7 e legamenti, fasce-logge-triangoli del collo, pelvimetria, arto superiore e inferiore, muscoli di collo sopraioidei/sottoioidei/prevertebrali/laterali, dorso spinoappendicolari/spinocostali/propri, torace intrinseci ed estrinseci, diaframma, addome, spalla, braccio, avambraccio, mano, anca, coscia, gamba con gruppo, origine, inserzione e funzione; cardiovascolare: cuore, Giacomini, solchi, trabecole, valvole, conduzione, Koch, focolai; linfatico: vasi, linfangione, dotto toracico, milza; respiratorio: seni paranasali, laringe, trachea, polmoni, acino, pleure; digerente: quadranti, plessi Meissner/Auerbach, esofago, peritoneo, stomaco, duodeno/Brunner, tenue/crasso, pancreas, fegato). VERIFICA ACCURATEZZA: prima di rispondere verifica con estremo rigore di non invertire mai origine e inserzione, destra e sinistra, anteriore e posteriore, o gruppi muscolari; non tirare mai a indovinare. REGOLE DI STILE: 1) Rispondi SOLO a cio che viene chiesto, in massimo 3-4 righe secche e dirette. 2) Zero preamboli, zero introduzioni, zero dettagli non richiesti. 3) Per gli elenchi usa solo trattino (- ) e al massimo 2-3 righe di spiegazione. 4) Mai usare asterischi, cancelletti o tabelle.';
    var cronologia = [{ role: 'system', content: systemPrompt }];

    var savedKey = localStorage.getItem('api_key') || localStorage.getItem('groq_key') || '';
    if (savedKey) {
      keyInput.value = savedKey;
      setupBox.style.display = 'none';
    }

    function toggleKey() {
      setupBox.style.display = (setupBox.style.display === 'none') ? 'block' : 'none';
    }

    function salvaKey() {
      var k = keyInput.value.replace(/\s+/g, '');
      localStorage.setItem('api_key', k);
      localStorage.setItem('groq_key', k);
      if (k) { setupBox.style.display = 'none'; }
      alert('Chiave salvata!');
    }

    function nuovaChat() {
      cronologia = [{ role: 'system', content: systemPrompt }];
      chatBox.innerHTML = 'Nuova sessione Anatomia 1 pronta.';
    }

    function resetBtn() {
      sendBtn.disabled = false;
      sendBtn.textContent = 'Invia';
    }

    function pulisciTesto(t) {
      return t.replace(/<think>[\s\S]*?<\/think>/g, '').replace(/[*#|]/g, '').replace(/\n{3,}/g, '\n\n').replace(/^\s+|\s+$/g, '');
    }

    function aggiungiTesto(classe, testo) {
      var div = document.createElement('div');
      div.className = classe;
      div.textContent = testo;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function inviaGroq(key, indice) {
      if (indice >= modelliGroq.length) {
        resetBtn();
        aggiungiTesto('bot', 'Connessione hotspot instabile. Tocca Invia per riprovare.');
        return;
      }
      sendBtn.textContent = indice === 0 ? 'Invio...' : 'Riprovo (' + (indice + 1) + ')...';

      var xhr = new XMLHttpRequest();
      xhr.open('POST', 'https://api.groq.com/openai/v1/chat/completions', true);
      xhr.setRequestHeader('Content-Type', 'application/json');
      xhr.setRequestHeader('Authorization', 'Bearer ' + key);
      xhr.timeout = 10000;

      xhr.ontimeout = function() {
        inviaGroq(key, indice + 1);
      };
      xhr.onerror = function() {
        resetBtn();
        aggiungiTesto('bot', 'Errore di rete hotspot.');
      };
      xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) {
          if (xhr.status === 0) return;
          if (xhr.status === 200) {
            resetBtn();
            try {
              var res = JSON.parse(xhr.responseText);
              var risposta = pulisciTesto(res.choices[0].message.content);
              cronologia.push({ role: 'assistant', content: risposta });
              aggiungiTesto('bot', risposta);
            } catch (e) {
              aggiungiTesto('bot', 'Errore risposta: ' + e.message);
            }
          } else if (xhr.status === 404 || xhr.status === 400 || xhr.status === 429 || xhr.status === 503) {
            inviaGroq(key, indice + 1);
          } else {
            resetBtn();
            aggiungiTesto('bot', 'Errore HTTP ' + xhr.status + ': ' + xhr.responseText);
          }
        }
      };

      xhr.send(JSON.stringify({
        model: modelliGroq[indice],
        temperature: 0.0,
        max_tokens: 240,
        messages: cronologia
      }));
    }

    function inviaGoogle(key, indice) {
      if (indice >= modelliGoogle.length) {
        resetBtn();
        aggiungiTesto('bot', 'Server Google occupati. Riprova tra qualche secondo.');
        return;
      }
      sendBtn.textContent = indice === 0 ? 'Invio...' : 'Riprovo (' + (indice + 1) + ')...';

      var contents = [];
      for (var i = 1; i < cronologia.length; i++) {
        contents.push({
          role: cronologia[i].role === 'assistant' ? 'model' : 'user',
          parts: [{ text: cronologia[i].content }]
        });
      }

      var xhr = new XMLHttpRequest();
      var url = 'https://generativelanguage.googleapis.com/v1beta/models/' + modelliGoogle[indice] + ':generateContent?key=' + encodeURIComponent(key);
      xhr.open('POST', url, true);
      xhr.setRequestHeader('Content-Type', 'application/json');
      xhr.timeout = 10000;

      xhr.ontimeout = function() {
        inviaGoogle(key, indice + 1);
      };
      xhr.onerror = function() {
        resetBtn();
        aggiungiTesto('bot', 'Errore di rete hotspot.');
      };
      xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) {
          if (xhr.status === 0) return;
          if (xhr.status === 200) {
            resetBtn();
            try {
              var res = JSON.parse(xhr.responseText);
              var risposta = pulisciTesto(res.candidates[0].content.parts[0].text);
              cronologia.push({ role: 'assistant', content: risposta });
              aggiungiTesto('bot', risposta);
            } catch (e) {
              aggiungiTesto('bot', 'Errore risposta: ' + e.message);
            }
          } else if (xhr.status === 404 || xhr.status === 429 || xhr.status === 503) {
            inviaGoogle(key, indice + 1);
          } else {
            resetBtn();
            aggiungiTesto('bot', 'Errore HTTP ' + xhr.status + ': ' + xhr.responseText);
          }
        }
      };

      xhr.send(JSON.stringify({
        systemInstruction: { parts: [{ text: systemPrompt }] },
        generationConfig: { maxOutputTokens: 240, temperature: 0.0 },
        contents: contents
      }));
    }

    function invia() {
      var key = keyInput.value.replace(/\s+/g, '');
      var testo = promptBox.value;
      if (!key) { setupBox.style.display = 'block'; alert('Inserisci prima la Chiave API.'); return; }
      if (!testo) return;

      aggiungiTesto('user', 'Tu: ' + testo);
      cronologia.push({ role: 'user', content: testo });
      if (cronologia.length > 7) {
        cronologia = [cronologia[0]].concat(cronologia.slice(cronologia.length - 6));
      }
      promptBox.value = '';
      sendBtn.disabled = true;

      if (key.indexOf('AQ.') === 0 || key.indexOf('AIza') === 0) {
        inviaGoogle(key, 0);
      } else {
        inviaGroq(key, 0);
      }
    }
  </script>
</body>
</html>
