<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Gemini 5c</title>
  <style>
    body { font-family: -apple-system, Helvetica, sans-serif; margin: 0; padding: 10px; background: #f2f2f7; color: #111; }
    #setup { background: #fff; padding: 10px; border-radius: 8px; margin-bottom: 10px; }
    input, textarea, button { width: 100%; box-sizing: border-box; font-size: 16px; border-radius: 8px; border: 1px solid #ccc; padding: 8px; margin-top: 6px; }
    button { background: #007aff; color: #fff; border: none; font-weight: bold; padding: 10px; }
    button:disabled { background: #99c9ff; }
    #chat { background: #fff; border-radius: 8px; padding: 10px; min-height: 240px; max-height: 55vh; overflow-y: auto; margin-bottom: 10px; white-space: pre-wrap; word-wrap: break-word; line-height: 1.4; }
    .user { color: #007aff; font-weight: bold; margin-top: 10px; }
    .bot { color: #111; margin-top: 4px; padding-bottom: 8px; border-bottom: 1px solid #eee; }
  </style>
</head>
<body>
  <div id="setup">
    <input type="password" id="apiKey" placeholder="Incolla qui la chiave API (AQ.Ab8...)">
    <button onclick="salvaKey()">Salva Chiave</button>
  </div>
  <div id="chat">Pronto. Inserisci la chiave API sopra e scrivi un messaggio.</div>
  <textarea id="prompt" rows="2" placeholder="Scrivi a Gemini..."></textarea>
  <button id="sendBtn" onclick="invia()">Invia</button>

  <script>
    var keyInput = document.getElementById('apiKey');
    var chatBox = document.getElementById('chat');
    var promptBox = document.getElementById('prompt');
    var sendBtn = document.getElementById('sendBtn');
    var modelloAttivo = '';

    if (localStorage.getItem('gemini_key')) {
      keyInput.value = localStorage.getItem('gemini_key');
    }

    function salvaKey() {
      localStorage.setItem('gemini_key', keyInput.value.replace(/\s+/g, ''));
      modelloAttivo = '';
      alert('Chiave salvata!');
    }

    function aggiungiTesto(classe, testo) {
      var div = document.createElement('div');
      div.className = classe;
      div.textContent = testo;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function trovaModello(key, callback) {
      if (modelloAttivo) { callback(null, modelloAttivo); return; }
      var xhr = new XMLHttpRequest();
      xhr.open('GET', 'https://generativelanguage.googleapis.com/v1beta/models?key=' + encodeURIComponent(key), true);
      xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) {
          if (xhr.status === 200) {
            try {
              var res = JSON.parse(xhr.responseText);
              var lista = res.models || [];
              var scelto = '';
              for (var i = 0; i < lista.length; i++) {
                var m = lista[i];
                var metodi = m.supportedGenerationMethods || [];
                if (metodi.indexOf('generateContent') !== -1 && m.name.indexOf('tts') === -1 && m.name.indexOf('image') === -1 && m.name.indexOf('live') === -1 && m.name.indexOf('transcribe') === -1) {
                  scelto = m.name;
                  if (m.name.indexOf('flash') !== -1) { break; }
                }
              }
              if (scelto) {
                modelloAttivo = scelto;
                callback(null, scelto);
              } else {
                callback('Nessun modello testuale disponibile per questa chiave.');
              }
            } catch (e) {
              callback('Errore lettura modelli: ' + e.message);
            }
          } else {
            callback('Errore verifica chiave (' + xhr.status + '): ' + xhr.responseText);
          }
        }
      };
      xhr.send();
    }

    function invia() {
      var key = keyInput.value.replace(/\s+/g, '');
      var testo = promptBox.value;
      if (!key) { alert('Inserisci prima la API Key.'); return; }
      if (!testo) { return; }

      aggiungiTesto('user', 'Tu: ' + testo);
      promptBox.value = '';
      sendBtn.disabled = true;
      sendBtn.textContent = 'Attendi...';

      trovaModello(key, function(err, modelName) {
        if (err) {
          sendBtn.disabled = false;
          sendBtn.textContent = 'Invia';
          aggiungiTesto('bot', err);
          return;
        }

        var xhr = new XMLHttpRequest();
        var url = 'https://generativelanguage.googleapis.com/v1beta/' + modelName + ':generateContent?key=' + encodeURIComponent(key);
        xhr.open('POST', url, true);
        xhr.setRequestHeader('Content-Type', 'application/json');

        xhr.onreadystatechange = function() {
          if (xhr.readyState === 4) {
            sendBtn.disabled = false;
            sendBtn.textContent = 'Invia';
            if (xhr.status === 200) {
              try {
                var res = JSON.parse(xhr.responseText);
                var risposta = res.candidates[0].content.parts[0].text;
                aggiungiTesto('bot', 'Gemini: ' + risposta);
              } catch (e) {
                aggiungiTesto('bot', 'Errore lettura risposta: ' + e.message);
              }
            } else {
              aggiungiTesto('bot', 'Errore HTTP ' + xhr.status + ': ' + xhr.responseText);
            }
          }
        };

        var payload = JSON.stringify({
          contents: [{ parts: [{ text: testo }] }]
        });
        xhr.send(payload);
      });
    }
  </script>
</body>
</html>
